name: Vega Health
description: 'Vega Health is a Durham, North Carolina healthcare AI company founded
  by Dr. Mark Sendak, formerly of the Duke Institute for Health Innovation. Its platform
  installs in a health system''s own environment (cloud or on-prem) to integrate,
  evaluate, monitor, and scale clinical AI solutions, alongside a curated marketplace
  of vetted health AI solutions and commercialization support for academic AI research.
  Launched October 2025 with a $4M seed round led by Bessemer Venture Partners. The
  company publishes a SafeBase trust center (SOC 2, HIPAA) but no public API, developer
  portal, or SDKs as of 2026-07-21.'
